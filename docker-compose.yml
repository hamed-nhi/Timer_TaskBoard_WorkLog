services:
  db:
    build:
      context: ./deploy
      dockerfile: Dockerfile.postgres
      args:
        POSTGRES_IMAGE: ${DOCKER_REGISTRY:-}postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_USER: timelog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: timelog
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelog"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://timelog:${DB_PASSWORD}@db:5432/timelog
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      GOOGLE_SHEETS_SERVICE_EMAIL: ${GOOGLE_SHEETS_SERVICE_EMAIL:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
      ARCAPTCHA_SITE_KEY: ${ARCAPTCHA_SITE_KEY:-}
      ARCAPTCHA_SECRET_KEY: ${ARCAPTCHA_SECRET_KEY:-}
      LOGIN_IP_BURST: ${LOGIN_IP_BURST:-30}
      LOGIN_IP_HOURLY: ${LOGIN_IP_HOURLY:-120}
      LOGIN_GLOBAL_PER_MINUTE: ${LOGIN_GLOBAL_PER_MINUTE:-300}
    depends_on:
      db:
        condition: service_healthy

  personal-backup:
    profiles: ["backup"]
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://timelog:${DB_PASSWORD}@db:5432/timelog
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./backups:/backups
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  backup-scheduler:
    profiles: ["backup"]
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.backup_scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://timelog:${DB_PASSWORD}@db:5432/timelog
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./backups:/backups
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
