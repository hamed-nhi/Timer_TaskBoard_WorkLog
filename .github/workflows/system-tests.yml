name: system-qa
on:
  workflow_dispatch:
jobs:
  docker-browser-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_DATABASE_URL: postgresql+psycopg://auditor:audit-password-only@127.0.0.1:5544/timelog_audit_test
      QA_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start isolated QA stack
        run: docker compose -p timelog-qa -f docker-compose.test.yml --profile audit up -d --build audit-db audit-api audit-web
      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18082/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python tools/qa_seed.py --load --reset-ui
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm ci --prefix tools/qa-browser
      - run: node tests/e2e/audit-ui.cjs
        working-directory: frontend
      - run: node tests/e2e/import-devices.cjs
        working-directory: frontend
      - run: node tests/e2e/login-security.cjs
        working-directory: frontend
      - run: node tests/e2e/password-visibility.cjs
        working-directory: frontend
      - run: python tools/audit_http_security.py
      - run: python tools/audit_load.py --seconds 30 --name release-legitimate-30s
      - run: python tools/audit_load.py --seconds 900 --name soak-release-15min
      - run: docker build -t timelog-qa-personal-backup -f backend/Dockerfile.backup backend
      - run: python tools/audit_personal_pipeline.py
      - run: python tools/audit_recovery.py
      - run: python tools/qa_crypto.py
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-qa-evidence
          path: |
            artifacts/audit/**/*.json
            artifacts/audit/**/*.xml
            artifacts/audit/**/*.png
      - name: Remove only the disposable QA stack
        if: always()
        run: docker compose -p timelog-qa -f docker-compose.test.yml --profile audit rm -s -f audit-web audit-api audit-db
