name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: timelog, POSTGRES_PASSWORD: timelog, POSTGRES_DB: timelog_test }
        ports: ["5442:5432"]
        options: --health-cmd "pg_isready -U timelog" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit and architecture tests
        run: python -m coverage run --branch --source=app -m pytest -q tests/unit
        working-directory: backend
      - name: PostgreSQL integration tests
        run: python -m coverage run --append --branch --source=app -m pytest -q tests/integration
        working-directory: backend
      - name: Backup fault injection
        run: pytest -q tests/operational -rx
        working-directory: backend
      - name: Coverage summary
        run: python -m coverage report
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run test:unit && npm run lint && npm run build
        working-directory: frontend
